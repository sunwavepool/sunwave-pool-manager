g{color:#1b7257;background:#e4f7ed;padding:12px;border-radius:9px;line-height:1.5;margin:10px 0}.role-layout{max-width:590px;margin:12vh auto;padding:24px}.role-layout .card{padding:26px}.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filters input,.filters select{border:1px solid #dbe5e9;border-radius:10px;padding:9px 10px;background:#fff;max-width:200px}.notice{font-size:12px;line-height:1.5;color:#6d8997}.seg{display:flex;gap:4px;background:#f0f6f8;border-radius:10px;padding:4px}.seg button{padding:7px 12px;border:0;background:transparent;border-radius:8px;color:#67828e;font-weight:770}.seg button.active{background:#fff;color:#136b83;box-shadow:0 2px 5px #183a4b15}.modal-back{position:fixed;inset:0;z-index:10;background:#0b1c2cb8;display:grid;place-items:center;padding:18px;overflow:auto}.dialog{background:#fff;border-radius:20px;padding:25px;width:100%;max-width:560px;max-height:90svh;overflow:auto;box-shadow:0 30px 100px #071f2a4b}.dialog-head{display:flex;align-items:start;justify-content:space-between;gap:10px;margin-bottom:20px}.dialog-head h2{font-size:22px;margin:0}.x{border:0;background:#eef4f6;color:#2f5366;width:33px;height:33px;font-weight:900;border-radius:9px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span-2{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}.info-rows{display:grid;gap:9px}.info-row{display:flex;justify-content:space-between;border-bottom:1px solid #e6eff1;padding-bottom:9px;gap:15px}.info-row:last-child{border:0}.mono{font-family:ui-monospace,monospace}.footer{font-size:11px;color:#8ca0a8;text-align:center;margin-top:30px}.toast{position:fixed;right:18px;bottom:22px;background:#183d4e;color:white;padding:14px 20px;border-radius:12px;box-shadow:0 10px 40px #0b222d40;z-index:100;max-width:90vw}.state-loading{display:grid;place-items:center;min-height:70svh;font-size:15px;color:#537 <body><div id="root"><div class="state-loading">Đang mở Sunwave Pool…</div></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
// Public browser key only. Never place Supabase secret/service_role keys in a client app.
const URL_BASE='https://dxzxpmtbjvayzpbndyuu.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_2csMJkaohwRN-tu3oAo7gQ_J6qdOWzW';
const AUTH_KEY='sunwave-pool-v5-auth';
const LEGACY_KEY='sunwave-pool-finance-v1';
const persons=['Hoàng','Đức','Tuấn'];
const categories=['Điện','Nước','Hóa chất hồ bơi','Bảo trì / sửa chữa','Nhân sự','Vệ sinh','Trang thiết bị','Thuế / phí báo cáo','Khác'];
const methods=['Chuyển khoản','Tiền mặt','Khác','Chưa xác định'];
const root=document.getElementById('root');
const state={session:null,user:null,profile:null,tab:'home',month:currentMonth(),year:new Date().getFullYear(),monthly:[],expenses:[],settings:null,overrides:[],users:[],legacy:[],income:[],reimbursements:[],budgets:[],loading:false,error:'',authMode:'login'};
function currentMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Math.round(Number(n)||0).toLocaleString('vi-VN')+'đ'}
function compactDate(s){if(!s)return '—';let [y,m,d]=s.slice(0,10).split('-');return `${d}/${m}/${y}`}
function monthLabel(p){if(!p)return '—';const [y,m]=p.split('-');return `Tháng ${Number(m)}/${y}`}
function positive(v){return Number.isSafeInteger(Number(v))&&Number(v)>0&&Number(v)<=1e12}
function errorText(e){let m=String(e?.message||e||'Lỗi không xác định');if(/failed to fetch|networkerror|load failed/i.test(m))return 'Không thể kết nối Supabase. Kiểm tra mạng hoặc thử lại.';return m}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.add('hidden'),4200)}
function saveSession(data){state.session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+Math.max(30,(data.expires_in||3600)-20)*1000};localStorage.setItem(AUTH_KEY,JSON.stringify(state.session))}
function removeSession(){state.session=null;state.user=null;state.profile=null;localStorage.removeItem(AUTH_KEY)}
async function request(path,{method='GET',body=null,auth=true,prefer='',retry=true}={}){
 if(auth)await ensureToken();
 const headers={'apikey':PUBLISHABLE_KEY,'Accept':'application/json'};
 if(body!==null)headers['Content-Type']='application/json';
 if(auth&&state.session?.access_token)headers.Authorization='Bearer '+state.session.access_token;
 if(prefer)headers.Prefer=prefer;
 let res;
 try{res=await fetch(URL_BASE+path,{method,headers,body:body===null?undefined:JSON.stringify(body)})}
 catch(e){throw new Error('Không thể kết nối Supabase. Kiểm tra mạng hoặc thử lại.')}
 if(res.status===401&&auth&&retry&&state.session?.refresh_token){await refresh();return request(path,{method,body,auth,prefer,retry:false})}
 let raw=await res.text(),data=null;
 if(raw){try{data=JSON.parse(raw)}catch{data=raw}}
 if(!res.ok)throw new Error(typeof data==='object'?data?.msg||data?.message||data?.error_description||data?.error||`HTTP ${res.status}`:`HTTP ${res.status}`);
 return data;
}
let renewing=null;
async function refresh(){if(!state.session?.refresh_token)throw new Error('Cần đăng nhập lại.');if(renewing)return renewing;renewing=(async()=>{const d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:state.session.refresh_token}});saveSession(d);return d})();try{return await renewing}catch(e){removeSession();throw e}finally{renewing=null}}
async function ensureToken(){if(!state.session?.access_token)throw new Error('Vui lòng đăng nhập');if(Date.now()>state.session.expires_at)await refresh()}
async function authAction(mode,email,password){if(!email||!password)throw new Error('Nhập đầy đủ email và mật khẩu.');if(mode==='signup')return request('/auth/v1/signup',{method:'POST',auth:false,body:{email,password}});return request('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}})}
async function init(){try{const s=localStorage.getItem(AUTH_KEY);if(s)state.session=JSON.parse(s)}catch{}if(state.session){try{await ensureToken();const u=await request('/auth/v1/user');state.user=u;await loadProfile();if(authorized())await loadData()}catch(e){removeSession();state.error='Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại.'}}render()}
async function loadProfile(){const p=await request('/rest/v1/pool_profiles?select=id,email,role&id=eq.'+encodeURIComponent(state.user.id));state.profile=p?.[0]||null;}
function isAdmin(){return state.profile?.role==='admin'}
function isViewer(){return state.profile?.role==='viewer'}
function authorized(){return isAdmin()||isViewer()}
async function enterAccount(){state.error='';await loadProfile();if(authorized())await loadData();render()}
async function loadData(){state.loading=true;state.error='';const from=String(state.year)+'-01-01',to=String(state.year)+'-12-01';try{
 const monthly=await request('/rest/v1/rpc/'+(isAdmin()?'pool_admin_monthly':'pool_basic_monthly'),{method:'POST',body:{p_from:from,p_to:to}});
 state.monthly=Array.isArray(monthly)?monthly:[];
 if(isAdmin()){
  const queries=[
    '/rest/v1/pool_expenses?select=*&order=occurred_on.desc&limit=3000',
    '/rest/v1/pool_settings?select=*',
    '/rest/v1/pool_rent_overrides?select=*&order=period.desc&limit=500',
    '/rest/v1/pool_profiles?select=id,email,role,created_at&order=created_at.asc',
    '/rest/v1/pool_legacy_reconciliations?select=*&order=period.desc&limit=500',
    '/rest/v1/pool_income?select=*&order=occurred_on.desc&limit=2000',
    '/rest/v1/pool_reimbursements?select=*&order=occurred_on.desc&limit=2000',
    '/rest/v1/pool_budgets?select=*'
  ];
  const sets=await Promise.all(queries.map(q=>request(q)));
  [state.expenses,state._settings,state.overrides,state.users,state.legacy,state.income,state.reimbursements,state.budgets]=sets;
  state.settings=state._settings?.[0]||null;
 }
 }catch(e){state.error=errorText(e)}finally{state.loading=false}}
async function reload(){await loadData();render()}
function logo(){return `<div class="brand"><div class="brandmark">≈</div><div><div class="brand-title">Sunwave Pool</div><div class="brand-sub">Quản lý tài chính · v5</div></div></div>`}
function card(label,value,note='',klass=''){return `<div class="card ${klass}"><div class="label">${esc(label)}</div><div class="number">${esc(value)}</div><div class="note">${esc(note)}</div></div>`}
function authScreen(){return `<div class="auth-layout"><div class="auth-card">${logo()}<h1>${state.authMode==='login'?'Đăng nhập':'Tạo tài khoản'}</h1><p>${state.authMode==='login'?'Dữ liệu Sunwave Pool được lưu và bảo vệ bằng Supabase.':'Tài khoản mới cần Admin phê duyệt trước khi được xem báo cáo.'}</p>${state.error?`<div class="error">${esc(state.error)}</div>`:''}<form id="auth-form"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="ten@email.com"></div><div class="field"><label>Mật khẩu</label><input name="password" type="password" minlength="6" required autocomplete="${state.authMode==='login'?'current-password':'new-password'}" placeholder="Tối thiểu 6 ký tự"></div><button class="btn primary wide" type="submit">${state.authMode==='login'?'Đăng nhập':'Đăng ký tài khoản'}</button></form><div class="auth-switch">${state.authMode==='login'?'Chưa có tài khoản?':'Đã có tài khoản?'} <button data-action="switch-auth">${state.authMode==='login'?'Đăng ký':'Đăng nhập'}</button></div><div class="divider"></div><p class="helper">Không có quyền sửa chữa khi ở vai trò Người dùng. Hệ thống không sử dụng tài khoản/mật khẩu dùng chung.</p></div></div>`}
function pendingScreen(){return `<div class="topbar"><div class="top-inner">${logo()}<button class="btn outline small" data-action="logout">Đăng xuất</button></div></div><div class="role-layout"><div class="card"><div class="eyebrow">XÁC THỰC TÀI KHOẢN</div><h1>${state.profile?'Chờ Admin cấp quyền':'Đang chuẩn bị tài khoản'}</h1><p>Đã đăng nhập: <b>${esc(state.user?.email)}</b></p><div class="subtle">Tài khoản mới chỉ được mở quyền xem khi Admin phê duyệt. Việc này ngăn người lạ tự đăng ký để xem tài chính.</div><div class="divider"></div><div class="inline-actions"><button class="btn primary" data-action="claim-admin">Kích hoạt Admin đầu tiên</button><button class="btn outline" data-action="check-role">Kiểm tra quyền</button></div><p class="notice" style="margin-top:14px">Nút kích hoạt Admin chỉ hoạt động một lần với email chủ sở hữu đã xác minh. Những tài khoản khác phải chờ Admin duyệt.</p>${state.error?`<div class="error">${esc(state.error)}</div>`:''}</div></div>`}
function tabs(){const items=isAdmin()?[['home','Tổng quan'],['expenses','Chi phí'],['rent','Tiền thuê'],['cash','Sổ thu & hoàn ứng'],['budget','Hạn mức'],['report','Báo cáo'],['users','Tài khoản'],['backup','Dữ liệu & sao lưu']]:[['home','Tổng quan'],['report','Báo cáo tháng']];return `<nav class="tabs">${items.map(([k,v])=>`<button class="tab ${state.tab===k?'active':''}" data-action="tab" data-tab="${k}">${v}</button>`).join('')}</nav>`}
function appScreen(){if(!isAdmin()&&!['home','report'].includes(state.tab))state.tab='home';const views={home:homeScreen,expenses:expensesScreen,rent:rentScreen,cash:cashScreen,budget:budgetScreen,report:reportScreen,users:usersScreen,backup:backupScreen};return `<header class="topbar"><div class="top-inner">${logo()}<div class="top-right"><span class="identity">${esc(state.user?.email)}</span><span class="pill ${isAdmin()?'admin':''}">${isAdmin()?'ADMIN':'CHỈ XEM'}</span><button class="btn outline small" data-action="logout">Thoát</button></div></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">SUNWAVE POOL · BÁO CÁO TRỰC TUYẾN</div><h1>${({home:'Tổng quan',expenses:'Chi phí phát sinh',rent:'Tiền thuê hồ bơi',cash:'Sổ thu & hoàn ứng',budget:'Hạn mức chi phí',report:'Báo cáo tài chính',users:'Quản lý tài khoản',backup:'Dữ liệu & sao lưu'})[state.tab]}</h1><p>${isAdmin()?'Số liệu lưu trên Supabase, cập nhật giữa các thiết bị.':'Tài khoản chỉ xem: không thể thêm, sửa, xóa dữ liệu.'}</p></div><div class="month-picker"><label class="muted" for="chosen-month">Tháng</label><input type="month" id="chosen-month" value="${esc(state.month)}"><button class="btn outline small" data-action="reload">Làm mới</button></div></div>${tabs()}${state.error?`<div class="error section">${esc(state.error)}</div>`:''}<div class="section">${(views[state.tab]||homeScreen)()}</div><footer class="footer">Sunwave Pool Manager v5 · Dữ liệu trực tuyến · Truy cập có phân quyền</footer></main>`}
function rowForMonth(p=state.month){return state.monthly.find(x=>x.period.slice(0,7)===p)||null}
function monthlyTotals(){return state.monthly.reduce((a,b)=>{a.rent+=Number(b.rent_base)||0;a.cost+=Number(b.expense_total)||0;a.remaining+=Number(b.remaining)||0;return a},{rent:0,cost:0,remaining:0})}
function homeScreen(){const r=rowForMonth();const base=Number(r?.rent_base)||0,cost=Number(r?.expense_total)||0,remaining=Number(r?.remaining)||0,shortfall=Number(r?.shortfall)||0;return `<div class="grid">${card('Tiền thuê '+monthLabel(state.month),money(base),r?'Mức gốc theo từng kỳ':'Chưa nhập tiền thuê kỳ này','feature')}${card('Chi phí phát sinh',money(cost),'Tất cả khoản phát sinh trong tháng, kể cả chưa thanh toán')}${isAdmin()?card('Còn phân chia',money(remaining),'Không âm; phần vượt ghi riêng',shortfall?'':''):card('Báo cáo cơ bản','Chỉ xem','Không có quyền sửa dữ liệu')}${isAdmin()?card('Chi phí vượt tiền thuê',money(shortfall),'Nếu chi phí vượt mức thuê'):card('Dữ liệu trực tuyến','Đã kết nối','Số liệu được lấy từ Supabase')}</div><div class="two-col section"><div class="card"><div class="section-head"><div><h2>Nguyên tắc tính toán</h2><p>Áp dụng từ tháng 11/2026 · Các kỳ lịch sử giữ nguyên nếu được nhập</p></div></div><div class="info-rows"><div class="info-row"><span>Tiền thuê tháng</span><b>${money(base)}</b></div><div class="info-row"><span>Trừ chi phí phát sinh</span><b>− ${money(cost)}</b></div>${isAdmin()?`<div class="info-row"><span><b>Số dư sau chi phí</b></span><b style="color:var(--green)">${money(remaining)}</b></div>`:""}${isAdmin()&&shortfall?`<div class="info-row"><span>Chi phí vượt</span><b style="color:var(--red)">${money(shortfall)}</b></div>`:''}</div><div class="subtle" style="margin-top:17px">Chi phí được khấu trừ một lần theo tháng phát sinh. Khoản hoàn ứng chỉ là chuyển tiền trả người chi hộ, không được tính vào chi phí lần thứ hai.</div></div><div class="card"><h2>${isAdmin()?'Phân chia số dư':'Báo cáo dành cho người dùng'}</h2>${isAdmin()?`<div class="people" style="margin-top:20px">${['Hoàng','Đức','Tuấn'].map((p,i)=>`<div class="person"><span>${p} · ${[60,30,10][i]}%</span><strong>${money(r?.[['hoang','duc','tuan'][i]])}</strong><small>Số tiền theo kỳ</small></div>`).join('')}</div><p class="notice" style="margin-top:20px">Nếu chi phí lớn hơn tiền thuê, số chia tạm tính 0đ, chênh lệch được ghi là phần vượt, không âm hóa lợi nhuận.</p>`:`<div class="subtle">Anh/chị có quyền xem tiền thuê và chi phí phát sinh hằng tháng. Bảng chia từng người, số dư lợi nhuận, giao dịch chi tiết và công cụ sửa chỉ dành cho Admin.</div>`}</div></div>${isAdmin()?`<div class="card section"><div class="section-head"><div><h2>Công việc nhanh</h2><p>Chỉ Admin có quyền ghi dữ liệu</p></div></div><div class="inline-actions"><button class="btn primary" data-action="expense-new">+ Thêm chi phí</button><button class="btn outline" data-action="tab" data-tab="rent">Điều chỉnh tiền thuê</button><button class="btn outline" data-action="tab" data-tab="backup">Nhập dữ liệu v4</button></div></div>`:''}`}
function reportScreen(){const vals=state.monthly;const total=monthlyTotals();return `<div class="grid">${card('Tổng tiền thuê '+state.year,money(total.rent),'Chỉ các kỳ có tiền thuê')}${card('Chi phí '+state.year,money(total.cost),'Tính theo thời điểm phát sinh')}${isAdmin()?card('Tổng còn phân chia',money(total.remaining),'Theo từng kỳ tháng'):card('Kỳ có số liệu',String(vals.length),'Báo cáo chỉ xem')}${isAdmin()?card('Dữ liệu kỳ',String(vals.length),'Bao gồm lịch sử đã nhập'):card('Quyền truy cập','Chỉ xem','Không có thao tác ghi')}</div><div class="card section"><div class="section-head"><div><h2>Báo cáo 12 tháng</h2><p>${isAdmin()?'Có tỷ lệ chia 60%/30%/10%; tính sau khi trừ chi phí':'Chỉ hiển thị số liệu tổng hợp tiền thuê và chi phí'}</p></div><div class="filters"><select id="report-year" aria-label="Năm báo cáo">${Array.from({length:7},(_,i)=>2024+i).map(y=>`<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('')}</select>${isAdmin()?'<button class="btn outline small" data-action="csv">Xuất CSV</button>':''}</div></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Kỳ</th><th class="right">Tiền thuê</th><th class="right">Chi phí</th>${isAdmin()?'<th class="right">Còn lại</th><th class="right">Hoàng 60%</th><th class="right">Đức 30%</th><th class="right">Tuấn 10%</th>':''}</tr></thead><tbody>${vals.length?vals.map(r=>`<tr><td><b>${monthLabel(r.period.slice(0,7))}</b></td><td class="right">${money(r.rent_base)}</td><td class="right">${money(r.expense_total)}</td>${isAdmin()?`<td class="right"><b>${money(r.remaining)}</b>${Number(r.shortfall)>0?`<div class="tag warn">Vượt ${money(r.shortfall)}</div>`:''}</td><td class="right">${money(r.hoang)}</td><td class="right">${money(r.duc)}</td><td class="right">${money(r.tuan)}</td>`:''}</tr>`).join(''):'<tr><td colspan="${isAdmin()?7:3}" class="empty">Chưa có dữ liệu cho năm này</td></tr>'}</tbody></table></div></div>`}
function expensesScreen(){if(!isAdmin())return '';const rows=state.expenses.filter(x=>x.period.slice(0,7)===state.month);const total=rows.reduce((n,r)=>n+Number(r.amount),0);return `<div class="grid">${card('Tổng chi phí tháng',money(total),'Bao gồm khoản chưa chi')}${card('Đã thanh toán',money(rows.filter(x=>x.paid).reduce((n,r)=>n+Number(r.amount),0)),'Theo trạng thái thực trả')}${card('Chưa thanh toán',money(rows.filter(x=>!x.paid).reduce((n,r)=>n+Number(r.amount),0)),'Vẫn được khấu trừ khỏi tiền thuê')}${card('Số khoản chi',String(rows.length),'Theo tháng được chọn')}</div><div class="card section"><div class="section-head"><div><h2>Sổ chi phí · ${monthLabel(state.month)}</h2><p>Thêm hóa đơn, chi phí đã phát sinh; khoản hoàn ứng không nhập tại đây.</p></div><button class="btn primary" data-action="expense-new">+ Thêm chi phí</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày / khoản chi</th><th>Loại</th><th>Người chi</th><th class="right">Số tiền</th><th>Trạng thái</th><th class="right">Thao tác</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.title)}</b><br><small>${compactDate(x.occurred_on)}${x.note?' · '+esc(x.note):''}</small></td><td>${esc(x.category)}</td><td>${esc(x.payer)}</td><td class="right"><b>${money(x.amount)}</b></td><td><span class="tag ${x.paid?'ok':'warn'}">${x.paid?'Đã trả':'Chưa trả'}</span></td><td class="right"><button class="btn outline small" data-action="expense-edit" data-id="${esc(x.id)}">Sửa</button> <button class="btn danger small" data-action="expense-delete" data-id="${esc(x.id)}">Xóa</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Tháng này chưa ghi nhận chi phí.</td></tr>`}</tbody></table></div></div>`}
function rentScreen(){if(!isAdmin())return '';const r=rowForMonth();const ov=state.overrides.find(x=>x.period.slice(0,7)===state.month);const confirmations=state.legacy.filter(x=>x.period.startsWith(String(state.year)));return `<div class="grid">${card('Tiền thuê kỳ',money(r?.rent_base),'Tháng '+state.month)}${card('Mức thuê chuẩn',money(state.settings?.rent_base||12000000),'Có hiệu lực từ '+(state.settings?.effective_from||'2026-11-01'))}${card('Chi phí khấu trừ',money(r?.expense_total),'Theo chi phí ghi nhận')}${card('Số dư phân chia',money(r?.remaining),'Trước khi chia 60/30/10')}</div><div class="two-col section"><div class="card"><div class="section-head"><div><h2>Tiền thuê tháng đã chọn</h2><p>Các kỳ cũ được giữ theo số liệu đã nhập, không thay 12 triệu</p></div><button class="btn primary" data-action="rent-edit">${ov?'Sửa kỳ thuê':'Ghi tiền thuê kỳ này'}</button></div><div class="info-rows"><div class="info-row"><span>Kỳ thuê</span><b>${monthLabel(state.month)}</b></div><div class="info-row"><span>Mức hiện tại</span><b>${money(r?.rent_base)}</b></div><div class="info-row"><span>Nguồn</span><b>${ov?'Điều chỉnh / lịch sử':'Mức chuẩn từ 11/2026'}</b></div></div>${ov?.memo?`<p class="notice" style="margin-top:12px">${esc(ov.memo)}</p>`:''}</div><div class="card"><h2>Kỳ cũ đã xác nhận trả đủ</h2><p class="muted">Nhập từ bản sao lưu v4; không tạo giao dịch hoặc ngày thanh toán giả.</p><div class="info-rows">${confirmations.length?confirmations.map(x=>`<div class="info-row"><span>${monthLabel(x.period.slice(0,7))}</span><b class="tag ok">${money(x.amount_confirmed)} · Đã trả</b></div>`).join(''):'<div class="subtle">Chưa nhập sao lưu v4, hoặc năm này không có kỳ xác nhận.</div>'}</div></div></div>`}
function cashScreen(){if(!isAdmin())return '';const inc=state.income.filter(x=>x.occurred_on.slice(0,7)===state.month);const reimb=state.reimbursements.filter(x=>x.occurred_on.slice(0,7)===state.month);const advance=Object.fromEntries(persons.map(p=>[p,state.expenses.filter(e=>e.payer===p&&e.paid).reduce((n,e)=>n+Number(e.amount),0)]));const repaid=Object.fromEntries(persons.map(p=>[p,state.reimbursements.filter(e=>e.person===p).reduce((n,e)=>n+Number(e.amount),0)]));return `<div class="grid">${card('Khoản thu tháng',money(inc.reduce((n,x)=>n+Number(x.amount),0)),'Theo tiền thực nhận')}${card('Hoàn ứng tháng',money(reimb.reduce((n,x)=>n+Number(x.amount),0)),'Không trừ chi phí lần thứ hai')}${card('Người ứng tiền',persons.filter(p=>advance[p]>0).length.toString(),'Có khoản chi hộ đã thanh toán')}${card('Thu trong kỳ',inc.length+' khoản','Theo sổ thu')}</div><div class="two-col section"><div class="card"><div class="section-head"><h2>Sổ khoản thu</h2><button class="btn primary small" data-action="income-new">+ Thêm thu</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày / nội dung</th><th class="right">Số tiền</th><th class="right">Sửa / xóa</th></tr></thead><tbody>${inc.length?inc.map(x=>`<tr><td>${esc(x.title)}<br><small>${compactDate(x.occurred_on)}</small></td><td class="right">${money(x.amount)}</td><td class="right"><button class="btn outline small" data-action="income-edit" data-id="${esc(x.id)}">Sửa</button> <button class="btn danger small" data-action="income-delete" data-id="${esc(x.id)}">Xóa</button></td></tr>`).join(''):'<tr><td colspan="3" class="empty">Chưa có khoản thu</td></tr>'}</tbody></table></div></div><div class="card"><div class="section-head"><h2>Chi hộ & hoàn ứng</h2><button class="btn primary small" data-action="reimbursement-new">+ Hoàn ứng</button></div><div class="info-rows">${persons.map(p=>`<div class="info-row"><span>${p}<br><small>Ứng ${money(advance[p])}, đã hoàn ${money(repaid[p])}</small></span><b>${money(Math.max(0,advance[p]-repaid[p]))}</b></div>`).join('')}</div><div class="divider"></div><h3>Hoàn ứng tháng này</h3>${reimb.length?reimb.map(x=>`<div class="info-row"><span>${esc(x.person)} · ${compactDate(x.occurred_on)} <button class="btn outline small" data-action="reimbursement-edit" data-id="${esc(x.id)}">Sửa</button></span><span><b>${money(x.amount)}</b> <button class="btn danger small" data-action="reimbursement-delete" data-id="${esc(x.id)}">×</button></span></div>`).join(''):'<p class="muted">Chưa có khoản hoàn ứng trong tháng.</p>'}<p class="notice">Số dư chi hộ tính trên toàn bộ lịch sử; không được hoàn vượt số đã chi hộ.</p></div></div>`}
function budgetScreen(){if(!isAdmin())return '';const total=state.expenses.filter(x=>x.period.startsWith(state.month)).reduce((n,x)=>n+Number(x.amount),0);return `<div class="card"><div class="section-head"><div><h2>Hạn mức chi phí theo nhóm</h2><p>So sánh theo tháng ${monthLabel(state.month)}. Hạn mức 0đ nghĩa là không áp dụng cảnh báo.</p></div></div><div class="info-rows">${categories.map(c=>{const used=state.expenses.filter(x=>x.period.startsWith(state.month)&&x.category===c).reduce((n,x)=>n+Number(x.amount),0);const limit=Number(state.budgets.find(x=>x.category===c)?.monthly_limit||0);return `<div class="info-row"><span><b>${esc(c)}</b><br><small>Đã phát sinh: ${money(used)} · Hạn mức: ${limit?money(limit):'Chưa đặt'}</small>${limit&&used>limit?'<br><span class="tag warn">Đã vượt hạn mức</span>':''}</span><button class="btn outline small" data-action="budget-edit" data-category="${esc(c)}">Thiết lập</button></div>`}).join('')}</div><div class="divider"></div><div class="subtle">Hạn mức chỉ dùng để cảnh báo. Chi phí phát sinh thực tế vẫn được trừ vào tiền thuê một lần khi tính số dư phân chia. Tổng chi phí tháng: <b>${money(total)}</b>.</div></div>`}
function actionBudget(category){const row=state.budgets.find(x=>x.category===category);openDialog('Hạn mức · '+category,field('amount','Hạn mức (đ/tháng, 0 = không giới hạn)',row?.monthly_limit||0,'number','required min="0" step="1"'),async f=>{const amount=Number(val(f,'amount'));if(!Number.isSafeInteger(amount)||amount<0||amount>1e12)throw Error('Hạn mức không hợp lệ.');await request('/rest/v1/pool_budgets?on_conflict=category',{method:'POST',body:{category,monthly_limit:amount},prefer:'resolution=merge-duplicates,return=minimal'});toast('Đã lưu hạn mức chi phí.');})}
function usersScreen(){if(!isAdmin())return '';return `<div class="card"><div class="section-head"><div><h2>Quản lý quyền truy cập</h2><p>Chỉ Admin duyệt người mới. Tài khoản chờ duyệt không có quyền đọc số liệu.</p></div><button class="btn outline small" data-action="reload">Làm mới</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Email</th><th>Ngày tạo</th><th>Quyền</th><th class="right">Thao tác</th></tr></thead><tbody>${state.users.length?state.users.map(x=>`<tr><td><b>${esc(x.email||x.id)}</b>${x.id===state.user?.id?' <span class="tag">Bạn</span>':''}</td><td>${compactDate(x.created_at)}</td><td><span class="tag ${x.role==='admin'?'ok':x.role==='pending'?'warn':''}">${x.role==='admin'?'Admin':x.role==='viewer'?'Chỉ xem':'Chờ duyệt'}</span></td><td class="right">${x.id===state.user?.id?'Không tự đổi quyền':`<select aria-label="Cấp quyền" data-role-id="${esc(x.id)}"><option value="pending" ${x.role==='pending'?'selected':''}>Chờ duyệt</option><option value="viewer" ${x.role==='viewer'?'selected':''}>Người xem</option><option value="admin" ${x.role==='admin'?'selected':''}>Admin</option></select>`}</td></tr>`).join(''):'<tr><td colspan="4">Chưa có tài khoản nào</td></tr>'}</tbody></table></div><p class="notice">Đổi quyền áp dụng ngay trên máy chủ. Người dùng đã đăng nhập cần làm mới để giao diện cập nhật; quyền ghi dữ liệu vẫn được máy chủ kiểm tra ở mỗi yêu cầu.</p></div>`}
function backupScreen(){if(!isAdmin())return '';const legacySaved=state.legacy.length;return `<div class="two-col"><div class="card"><h2>Nhập dữ liệu từ v4</h2><p class="muted">Chuyển lịch sử tiền thuê, 10 kỳ đã xác nhận trả đủ, khoản thu, chi phí, chi hộ và hoàn ứng lên Supabase.</p><div class="warning">Chỉ nhập <b>một lần</b> khi mới chuyển sang v5. Bản sao lưu được giữ trong cơ sở dữ liệu và bản cũ trong Safari không bị xóa. Không tải JSON lên GitHub công khai.</div><div style="margin-top:17px" class="stack"><button class="btn outline wide" data-action="legacy-from-local">Nhập từ dữ liệu v4 trên Safari này</button><label class="upload-zone">Chọn bản sao lưu v4 (.json) từ Tệp trên iPhone<input type="file" id="legacy-file" accept=".json,application/json"></label><small>Để nhập, hãy sử dụng file sao lưu mới nhất đã lưu sau khi xác nhận 10/10 kỳ trả đủ. File JSON cũ hơn có thể chưa có trạng thái này.</small></div></div><div class="card"><h2>Sao lưu dữ liệu trên Supabase</h2><p class="muted">Admin có thể xuất dữ liệu quản lý hiện tại ra JSON để lưu riêng trong iCloud Drive.</p><button class="btn primary wide" data-action="cloud-export">Tải bản sao lưu trên Supabase</button><div class="divider"></div><h3>Kiểm tra lịch sử thanh toán</h3><p>Trạng thái xác nhận kỳ thuê đã nhập từ v4: <b>${legacySaved} kỳ</b> trong cơ sở dữ liệu mới.</p><p class="notice">Hệ thống mới không tạo chứng từ hoặc ngày thanh toán cho những kỳ chỉ được xác nhận trạng thái.</p></div></div>`}
function render(){if(!state.session||!state.user){root.innerHTML=authScreen();return}if(!authorized()){root.innerHTML=pendingScreen();return}root.innerHTML=appScreen()}
function setBusy(on){state.loading=on;document.querySelectorAll('button[type=submit]').forEach(b=>{b.disabled=on;b.classList.toggle('loading-button',on)})}
function openDialog(title,html,onSubmit=null){const back=document.createElement('div');back.className='modal-back';back.id='modal';back.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title">${esc(title)}</h2><button class="x" data-action="close-modal">×</button></div>${onSubmit?`<form id="modal-form">${html}<div class="dialog-actions"><button type="button" class="btn outline" data-action="close-modal">Hủy</button><button class="btn primary" type="submit">Lưu dữ liệu</button></div></form>`:html}</div>`;document.body.appendChild(back);back._submit=onSubmit;back.addEventListener('click',e=>{if(e.target===back)closeDialog()});}
function closeDialog(){document.getElementById('modal')?.remove()}
function val(form,key){return form.elements.namedItem(key)?.value?.trim()||''}
function field(name,label,value='',type='text',extra='',className=''){return `<div class="field ${className}"><label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function optionField(name,label,list,value='',className=''){return `<div class="field ${className}"><label>${esc(label)}</label><select name="${name}">${list.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function notesField(v=''){return `<div class="field span-2"><label>Ghi chú</label><textarea name="note" maxlength="1500">${esc(v)}</textarea></div>`}
function readAmount(f){const n=Number(val(f,'amount'));if(!positive(n))throw new Error('Số tiền phải là số nguyên dương hợp lệ.') ;return n}
function actionExpense(id=''){const x=state.expenses.find(z=>z.id===id)||{occurred_on:state.month+'-01',title:'',category:'Điện',amount:'',paid:false,payer:'Quỹ hồ bơi',method:'Chưa xác định',note:''};const html=`<div class="form-grid">${field('title','Nội dung',x.title,'text','required maxlength="200"','span-2')}${field('occurred_on','Ngày phát sinh',x.occurred_on,'date','required')}${field('amount','Số tiền (VNĐ)',x.amount,'number','required min="1" step="1"')}${optionField('category','Nhóm chi phí',categories,x.category)}${optionField('payer','Người chi',['Quỹ hồ bơi',...persons,'Khác'],x.payer)}${optionField('method','Phương thức',methods,x.method)}${optionField('paid','Trạng thái',['Chưa thanh toán','Đã thanh toán'],x.paid?'Đã thanh toán':'Chưa thanh toán')}${notesField(x.note)}</div><p class="notice">Kỳ chi phí được xác định theo ngày phát sinh. Dù chưa thanh toán, chi phí đã phát sinh vẫn trừ vào tiền thuê.</p>`;openDialog(id?'Sửa chi phí':'Thêm chi phí',html,async f=>{const date=val(f,'occurred_on'),amount=readAmount(f),title=val(f,'title');if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Vui lòng kiểm tra ngày và nội dung.');const payload={occurred_on:date,period:date.slice(0,7)+'-01',title,amount,category:val(f,'category'),payer:val(f,'payer'),method:val(f,'method'),paid:val(f,'paid')==='Đã thanh toán',note:val(f,'note')};await request(id?'/rest/v1/pool_expenses?id=eq.'+encodeURIComponent(id):'/rest/v1/pool_expenses',{method:id?'PATCH':'POST',body:id?payload:payload,prefer:'return=minimal'});toast('Đã lưu khoản chi.');})}
function actionRent(){const ov=state.overrides.find(x=>x.period.slice(0,7)===state.month);const r=rowForMonth();const html=`<div class="warning">Chỉ dùng để ghi số thuê từng kỳ. Lịch sử 1–10/2026 được nhập từ bản sao lưu, không tự đổi sang 12 triệu.</div><div style="height:16px"></div>${field('amount','Tiền thuê kỳ '+state.month,ov?.rent_base||r?.rent_base||12000000,'number','min="0" required step="1"')}${field('memo','Ghi chú',ov?.memo||'','text','maxlength="300"')}`;openDialog('Điều chỉnh tiền thuê',html,async f=>{const amt=Number(val(f,'amount'));if(!Number.isSafeInteger(amt)||amt<0||amt>1e12)throw Error('Tiền thuê không hợp lệ.');await request('/rest/v1/pool_rent_overrides?on_conflict=period',{method:'POST',body:{period:state.month+'-01',rent_base:amt,memo:val(f,'memo')},prefer:'resolution=merge-duplicates,return=minimal'});toast('Đã cập nhật tiền thuê tháng.');})}
function actionIncome(id=''){const x=state.income.find(z=>z.id===id)||{occurred_on:today(),title:'',category:'Khác',amount:'',method:'Chưa xác định',note:''};const html=`<div class="form-grid">${field('title','Nội dung khoản thu',x.title,'text','required maxlength="200"','span-2')}${field('occurred_on','Ngày nhận',x.occurred_on,'date','required')}${field('amount','Số tiền',x.amount,'number','min="1" step="1" required')}${optionField('category','Loại thu',['Vé bơi','Học bơi','Cho thuê hồ bơi','Dịch vụ khác','Khác'],x.category)}${optionField('method','Phương thức',methods,x.method)}${notesField(x.note)}</div>`;openDialog(id?'Sửa khoản thu':'Thêm khoản thu',html,async f=>{const body={title:val(f,'title'),occurred_on:val(f,'occurred_on'),amount:readAmount(f),category:val(f,'category'),method:val(f,'method'),note:val(f,'note')};if(!body.title)throw Error('Chưa có nội dung.');await request(id?'/rest/v1/pool_income?id=eq.'+encodeURIComponent(id):'/rest/v1/pool_income',{method:id?'PATCH':'POST',body,prefer:'return=minimal'});toast('Đã lưu khoản thu.');})}
function actionReimbursement(id=''){const x=state.reimbursements.find(z=>z.id===id)||{occurred_on:today(),person:'Hoàng',amount:'',method:'Chưa xác định',note:''};const html=`<div class="form-grid">${optionField('person','Người nhận',persons,x.person)}${field('occurred_on','Ngày hoàn ứng',x.occurred_on,'date','required')}${field('amount','Số tiền hoàn',x.amount,'number','min="1" step="1" required')}${optionField('method','Phương thức',methods,x.method)}${notesField(x.note)}</div><p class="notice">Hoàn ứng không tạo thêm chi phí khấu trừ. Chỉ hoàn số tiền đã chi hộ thực tế.</p>`;openDialog(id?'Sửa hoàn ứng':'Thêm hoàn ứng',html,async f=>{const person=val(f,'person'),amount=readAmount(f),advance=state.expenses.filter(e=>e.payer===person&&e.paid).reduce((n,e)=>n+Number(e.amount),0);const already=state.reimbursements.filter(e=>e.person===person&&e.id!==id).reduce((n,e)=>n+Number(e.amount),0);if(amount>advance-already)throw Error(`Số hoàn vượt khoản ứng còn lại (${money(Math.max(advance-already,0))}).`);await request(id?'/rest/v1/pool_reimbursements?id=eq.'+encodeURIComponent(id):'/rest/v1/pool_reimbursements',{method:id?'PATCH':'POST',body:{person,amount,occurred_on:val(f,'occurred_on'),method:val(f,'method'),note:val(f,'note')},prefer:'return=minimal'});toast('Đã ghi hoàn ứng.');})}
async function doDelete(type,id){const names={expense:['pool_expenses','chi phí'],income:['pool_income','khoản thu'],reimbursement:['pool_reimbursements','hoàn ứng']};if(!names[type])return;if(!confirm('Xóa '+names[type][1]+' này? Hành động không thể hoàn tác.'))return;await request('/rest/v1/'+names[type][0]+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'});toast('Đã xóa dữ liệu.');await reload()}
async function importLegacy(data){if(!isAdmin())throw Error('Chỉ Admin được nhập dữ liệu.');if(!data||!Array.isArray(data.rentSchedule))throw Error('File không phải bản sao lưu Sunwave Pool hợp lệ.');const n=data.rentSchedule.length;if(!confirm(`Nhập ${n} kỳ tiền thuê và dữ liệu v4 vào Supabase? Thao tác chỉ thực hiện một lần; bản sao lưu gốc được giữ lại.`))return;const result=await request('/rest/v1/rpc/pool_import_legacy_safe',{method:'POST',body:{p_snapshot:data}});toast(`Đã nhập dữ liệu cũ: ${result?.imported_rent_periods||0} kỳ thuê.`);await reload()}
function saveJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function exportCloud(){const snaps=await request('/rest/v1/pool_legacy_snapshots?select=legacy_json,saved_at&limit=1');saveJSON('sunwave-supabase-v5-'+today()+'.json',{version:5,exported_at:new Date().toISOString(),settings:state.settings,monthly:state.monthly,expenses:state.expenses,overrides:state.overrides,legacy_reconciliations:state.legacy,income:state.income,reimbursements:state.reimbursements,budgets:state.budgets,legacy_backup:snaps?.[0]?.legacy_json||null});toast('Đã tạo bản sao lưu. Lưu file ở nơi riêng tư.');}
function csv(){const rows=[['Tháng','Tiền thuê','Chi phí','Còn lại','Hoàng 60%','Đức 30%','Tuấn 10%'],...state.monthly.map(x=>[x.period,x.rent_base,x.expense_total,x.remaining,x.hoang,x.duc,x.tuan])];const out='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='sunwave-report-'+state.year+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function clickAction(el){const a=el.dataset.action,id=el.dataset.id||'';if(a==='switch-auth'){state.authMode=state.authMode==='login'?'signup':'login';state.error='';render();return}
 if(a==='tab'){state.tab=el.dataset.tab;render();return}if(a==='close-modal'){closeDialog();return}
 if(a==='logout'){try{await request('/auth/v1/logout',{method:'POST'})}catch{}removeSession();state.tab='home';render();return}
 if(a==='claim-admin'){if(!confirm('Kích hoạt Admin đầu tiên cho tài khoản chủ sở hữu đã xác minh?'))return;await request('/rest/v1/rpc/pool_claim_initial_admin',{method:'POST',body:{}});await enterAccount();toast('Đã kích hoạt quyền Admin.');return}
 if(a==='check-role'){await enterAccount();toast('Đã kiểm tra quyền tài khoản.');return}
 if(a==='reload'){await reload();toast('Đã cập nhật dữ liệu.');return}
 if(!isAdmin())return;
 if(a==='expense-new')return actionExpense();if(a==='expense-edit')return actionExpense(id);
 if(a==='rent-edit')return actionRent();if(a==='budget-edit')return actionBudget(el.dataset.category||'Khác');
 if(a==='income-new')return actionIncome();if(a==='income-edit')return actionIncome(id);
 if(a==='reimbursement-new')return actionReimbursement();if(a==='reimbursement-edit')return actionReimbursement(id);
 if(a==='expense-delete')return doDelete('expense',id);if(a==='income-delete')return doDelete('income',id);if(a==='reimbursement-delete')return doDelete('reimbursement',id);
 if(a==='legacy-from-local'){const s=localStorage.getItem(LEGACY_KEY);if(!s)throw Error('Không tìm thấy dữ liệu v4 trong Safari này. Hãy nhập file JSON từ Tệp trên iPhone.');return importLegacy(JSON.parse(s))}
 if(a==='cloud-export')return exportCloud();if(a==='csv')return csv();
}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();try{await clickAction(el)}catch(err){state.error=errorText(err);if(document.getElementById('modal'))toast(state.error);else render()}});
document.addEventListener('change',async e=>{const el=e.target;try{
 if(el.id==='chosen-month'){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(el.value))return;state.month=el.value;const y=Number(el.value.slice(0,4));if(y!==state.year){state.year=y;await loadData()}render()}
 else if(el.id==='report-year'){state.year=Number(el.value);await reload()}
 else if(el.matches('[data-role-id]')){if(!isAdmin())return;const id=el.dataset.roleId,v=el.value;const p=state.users.find(x=>x.id===id);if(!p||p.id===state.user.id)return;if(!confirm(`Đổi quyền ${p.email||id} thành ${v==='admin'?'Admin':v==='viewer'?'Người dùng chỉ xem':'Chờ duyệt'}?`)){render();return}await request('/rest/v1/pool_profiles?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{role:v},prefer:'return=minimal'});toast('Đã cập nhật quyền truy cập.');await reload()}
 else if(el.id==='legacy-file'){const f=el.files?.[0];if(!f)return;if(f.size>8_000_000)throw Error('Tệp JSON quá lớn.');await importLegacy(JSON.parse(await f.text()))}
 }catch(err){state.error=errorText(err);render()}});
document.addEventListener('submit',async e=>{const f=e.target;if(f.id!=='auth-form'&&f.id!=='modal-form')return;e.preventDefault();setBusy(true);try{
 if(f.id==='auth-form'){
  const d=await authAction(state.authMode,val(f,'email'),val(f,'password'));
  if(state.authMode==='signup'&&!d?.access_token){state.authMode='login';state.error='Tài khoản đã được tạo. Vui lòng xác minh email (nếu có thư), rồi đăng nhập. Sau đó chờ Admin cấp quyền.';render();return}
  saveSession(d);state.user=d.user||await request('/auth/v1/user');state.tab='home';await enterAccount();
 }else{
  const handler=document.getElementById('modal')?._submit;if(!handler)return;await handler(f);closeDialog();await reload();
 }
 }catch(err){const m=errorText(err);if(f.id==='auth-form'){state.error=m;render()}else toast(m)}finally{setBusy(false)}});
init();
})();
</script></body></html>
